<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <title>Page Not Found — Bhone Myat Oo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <section class="hero-bg min-h-screen flex items-center justify-center px-6 py-20">

    <img src="/images/starry-night/star.png" class="sn-footer-el" id="fn-star" aria-hidden="true" alt="">
    <img src="/images/starry-night/wave.png" class="sn-footer-el" id="fn-wave" aria-hidden="true" alt="">
    <img src="/images/starry-night/smallstar.png" class="sn-footer-el" id="fn-smallstar" aria-hidden="true" alt="">

    <div class="max-w-xl w-full text-center relative z-10">

      <div

        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">

            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />

      </div>

      <p class="text-7xl md:text-8xl font-extrabold tracking-tight text-slate-900 mb-4">404</p>
      <div class="mb-6">
        <div class="section-rule"></div>
      </div>

      <h1 class="text-2xl md:text-3xl font-bold text-slate-900 mb-3">This page wandered off</h1>
      <p class="text-slate-500 leading-relaxed mb-10">
        The page you're looking for doesn't exist or may have moved.
      </p>

      <div class="flex flex-wrap justify-center gap-3">
        <a href="/" class="btn-work">Back to Home</a>
        <a href="/projects/" class="btn-secondary">
          My Projects
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
      </div>

    </div>

</html>
